<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Compass AI🚀</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #182848;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        h2 {
            color: #182848;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: #182848;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2b4c7e;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #eef3ff;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🎯 Career Compass AI</h1>
    <p>Discover a career path based on your interests and skills</p>
</header>

<div class="container">

    <h2>Tell us about yourself</h2>

    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="interest">Your Main Interest</label>
    <select id="interest">
        <option value="">Select an interest</option>
        <option value="coding">Coding & Technology</option>
        <option value="data">Data & Analytics</option>
        <option value="design">Design & Creativity</option>
        <option value="business">Business & Management</option>
    </select>

    <label for="skill">Your Strongest Skill</label>
    <select id="skill">
        <option value="">Select a skill</option>
        <option value="programming">Programming</option>
        <option value="analysis">Problem Solving & Analysis</option>
        <option value="communication">Communication</option>
        <option value="creativity">Creativity</option>
    </select>
    <label for="goal"> Your Carrer Goal</label>
    <select id="goal">
        <option value="">Select Your goal</option>
        <option value="job">Get a job quckily</option>
        <option value="salary">High salary carrer</option>
        <option value="government">Government job</option>
        <option value="business">Start a business</option>
    </select>
    <label for="work">Preferred Work Type</label>
    <select id="work">
        <option value="">Select work type</option>
        <option value="techincal"Technical">Technical Work</option>
        <option value="creative">Creative Work</option>
        <option value="analytical">Analytical Work</option>
        <option value="people">Working With People</option>
    </select>

    <button onclick="recommendCareer()">Find My Career 🚀</button>

    <div id="result"></div>

</div>

<script>
function recommendCareer() {

    const name = document.getElementById("name").value.trim();
    const interest = document.getElementById("interest").value;
    let skill = document.getElementById("skill").value;
    let goal=document.getElementById("goal").value;
    const work=document.getElementById("work").value;
    let result = document.getElementById("result");

    if (name === "" || interest === "" || skill === ""||goal ===""||work ==="") {
        result.style.display = "block";
        result.innerHTML = "<h3>⚠️ Please fill in all the details.</h3>";
        return;
    }

    let career;
    let skills;
    let jobs;
    let roadmap;
    if(goal ==="government"){
        career="Government Technology Career🏛️";
        skills="Computer Basics, Programming Aptitude, General Knowledge";
        jobs = "Government IT jobs, Techincal Assistant, Computer Operator";
        roadmap="Learn technical skills -> prepare for exams -> Apply for government jobs";
    }
    else if(work ==="techincal" && interest ==="coding"){
        career = "Software Developer 💻";
        skills="Java,Python,SQL,Git";
        jobs="Software Developer,Backend Developer";
        roadmap="programming -> DSA ->Projects ->Interview Preparation";
    }
    else if(work ==="analytical" && interest ==="data"){
         career = "Data Analyst 📊";
        skills="Exce"Excel, SQL, Python, Power BI";
        jobs = "Data Analyst, Business Intelligence Analyst";
        roadmap = "Excel → SQL → Power BI → Python → Projects";

    }

    else if (work === "creative" && interest === "design") {

        career = "UI/UX Designer 🎨";
        skills = "Figma, UI Design, UX Research";
        jobs = "UI Designer, UX Designer";
        roadmap = "Design Basics → Figma → Projects → Portfolio";

    }

    else if (work === "people" && interest === "business") {

        career = "Business Analyst 📈";
        skills = "Communication, Excel, SQL, Power BI";
        jobs = "Business Analyst, Associate Business Analyst";
        roadmap = "Business Basics → Excel → SQL → Power BI → Projects";

    }

    else if (interest === "coding" && skill === "programming") {

        career = "Software Developer 💻";
        skills = "Java, Python, SQL, Git";
        jobs = "Software Developer, Backend Developer";
        roadmap = "Programming → DSA → Projects → Interview Preparation";

    }

    else if (interest === "data" && skill === "analysis") {

        career = "Data Analyst 📊";
        skills = "Excel, SQL, Python, Power BI";
        jobs = "Data Analyst, Business Intelligence Analyst";
        roadmap = "Excel → SQL → Power BI → Python → Projects";

    }

    else if (interest === "design" && skill === "creativity") {

        career = "UI/UX Designer 🎨";
        skills = "Figma, UI Design, UX Research";
        jobs = "UI Designer, UX Designer";
        roadmap = "Design Basics → Figma → Projects → Portfolio";

    }

    else if (interest === "business" && skill === "communication") {

        career = "Business Analyst 📈";
        skills = "Communication, Excel, SQL, Power BI";
        jobs = "Business Analyst, Associate Business Analyst";
        roadmap = "Business Basics → Excel → SQL → Power BI → Projects";

    }

    else {

        career = "Technology & Business Professional 🚀";
        skills = "Communication, Problem Solving, Digital Skills";
        jobs = "Technology Associate, Business Associate";
        roadmap = "Build skills → Complete projects → Gain experience → Apply for jobs";

    }

    result.style.display = "block";

    result.innerHTML =
        "<h2>Hello " + name + "! 👋</h2>" +
        "<h2>🎯 Recommended Career</h2>" +
        "<h3>" + career + "</h3>" +
        "<h3>📚 Skills to Learn</h3>" +
        "<p>" + skills + "</p>" +
        "<h3>💼 Possible Job Roles</h3>" +
        "<p>" + jobs + "</p>" +
        "<h3>🛣️ Career Roadmap</h3>" +
        "<p>" + roadmap + "</p>";
}
   
</script>

</body>
</html>

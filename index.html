<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Compass AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #182848;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        h2 {
            color: #182848;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: #182848;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2b4c7e;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #eef3ff;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎯 Career Compass AI</h1>
        <p>Discover a career path based on your interests and skills</p>
    </header>

    <div class="container">

        <h2>Tell us about yourself</h2>

        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="interest">Your Main Interest</label>
        <select id="interest">
            <option value="">Select an interest</option>
            <option value="coding">Coding & Technology</option>
            <option value="data">Data & Analytics</option>
            <option value="design">Design & Creativity</option>
            <option value="business">Business & Management</option>
        </select>

        <label for="skill">Your Strongest Skill</label>
        <select id="skill">
            <option value="">Select a skill</option>
            <option value="programming">Programming</option>
            <option value="analysis">Problem Solving & Analysis</option>
            <option value="communication">Communication</option>
            <option value="creativity">Creativity</option>
        </select>

        <label for="goal">Career Goal</label>
        <select id="goal">
            <option value="">Select your career goal</option>
            <option value="quick">Get a job quickly</option>
            <option value="salary">High salary career</option>
            <option value="government">Government job</option>
            <option value="business">Start a business</option>
        </select>

        <label for="work">Preferred Work Type</label>
        <select id="work">
            <option value="">Select work type</option>
            <option value="technical">Technical Work</option>
            <option value="creative">Creative Work</option>
            <option value="analytical">Analytical Work</option>
            <option value="people">Working With People</option>
        </select>

        <button type="button" onclick="recommendCareer()">
            Find My Career 🚀
        </button>

        <div id="result"></div>

    </div>

    <script>

  function recommendCareer() {
    const name = document.getElementById("name").value.trim();
    const interest = document.getElementById("interest").value;
    const skill = document.getElementById("skill").value;
    const goal = document.getElementById("goal").value;
    const work = document.getElementById("work").value;
    const result = document.getElementById("result");

    if (!name || !interest || !skill || !goal || !work) {
        result.style.display = "block";
        result.innerHTML = "<h3>⚠️ Please fill in all the details.</h3>";
        return;
    }

    const careers = [
        {
            name: "Software Developer 💻",
            interests: ["coding"],
            skills: ["programming"],
            works: ["technical"],
            goals: ["job", "salary"],
            learn: ["Java", "Python", "SQL", "Git", "Data Structures"],
            jobs: ["Software Developer", "Backend Developer"],
            roadmap: [
                "Weeks 1–2: Java basics and problem solving",
                "Weeks 3–4: Object-oriented programming and SQL",
                "Weeks 5–6: Data Structures and Git",
                "Weeks 7–8: Build a project and practise interviews"
            ]
        },
        {
            name: "Data Analyst 📊",
            interests: ["data"],
            skills: ["analysis"],
            works: ["analytical"],
            goals: ["job", "salary"],
            learn: ["Excel", "SQL", "Python", "Power BI"],
            jobs: ["Data Analyst", "Business Intelligence Analyst"],
            roadmap: [
                "Weeks 1–2: Excel and data cleaning",
                "Weeks 3–4: SQL queries and practice",
                "Weeks 5–6: Power BI dashboards and Python",
                "Weeks 7–8: Build a data analysis project"
            ]
        },
        {
            name: "UI/UX Designer 🎨",
            interests: ["design"],
            skills: ["creativity"],
            works: ["creative"],
            goals: ["job", "business"],
            learn: ["Design principles", "Figma", "Wireframes", "Prototyping"],
            jobs: ["UI Designer", "UX Designer"],
            roadmap: [
                "Weeks 1–2: Learn design principles",
                "Weeks 3–4: Practise Figma",
                "Weeks 5–6: Create app screens and prototypes",
                "Weeks 7–8: Build a portfolio project"
            ]
        },
        {
            name: "Business Analyst 📈",
            interests: ["business", "data"],
            skills: ["analysis", "communication"],
            works: ["analytical", "people"],
            goals: ["job", "salary", "business"],
            learn: ["Excel", "SQL", "Communication", "Requirements analysis"],
            jobs: ["Business Analyst", "Operations Analyst"],
            roadmap: [
                "Weeks 1–2: Excel and communication",
                "Weeks 3–4: Business analysis fundamentals",
                "Weeks 5–6: SQL and requirement documents",
                "Weeks 7–8: Complete a case-study project"
            ]
        },
        {
            name: "Government Technology Career 🏛️",
            interests: ["coding", "data", "business"],
            skills: ["programming", "analysis", "communication"],
            works: ["technical", "analytical", "people"],
            goals: ["government"],
            learn: ["Aptitude", "Reasoning", "General Awareness", "Computer Basics"],
            jobs: ["Government IT Officer", "Technical Assistant"],
            roadmap: [
                "Weeks 1–2: Check suitable exams and eligibility",
                "Weeks 3–4: Practise quantitative aptitude",
                "Weeks 5–6: Practise reasoning and general awareness",
                "Weeks 7–8: Solve mock tests and review mistakes"
            ]
        },
        {
            name: "Entrepreneur / Startup Founder 🚀",
            interests: ["business", "design"],
            skills: ["communication", "creativity"],
            works: ["people", "creative"],
            goals: ["business", "salary"],
            learn: ["Market research", "Marketing", "Finance basics", "Presentation"],
            jobs: ["Startup Founder", "Business Owner"],
            roadmap: [
                "Weeks 1–2: Identify a problem to solve",
                "Weeks 3–4: Research customers and competitors",
                "Weeks 5–6: Create a simple business plan",
                "Weeks 7–8: Test your idea and gather feedback"
            ]
        }
    ];

    function calculateScore(career) {
        let score = 0;
        if (career.interests.includes(interest)) score += 4;
        if (career.skills.includes(skill)) score += 3;
        if (career.works.includes(work)) score += 2;
        if (career.goals.includes(goal)) score += 3;

        // Give extra priority when the user selects a government career goal.
        if (goal === "government" && career.goals.includes("government")) {
            score += 8;
        }

        return score;
    }

    const ranked = careers
        .map(career => ({ ...career, score: calculateScore(career) }))
        .sort((a, b) => b.score - a.score);

    const best = ranked[0];
    const alternative = ranked[1];
    const percentage = Math.round((best.score / 20) * 100);

    result.style.display = "block";
    result.innerHTML = `
        <h2>Hello ${escapeHTML(name)}! 👋</h2>

        <h2>🎯 Recommended Career</h2>
        <h3>${best.name}</h3>

        <h3>📊 Career Match</h3>
        <p><strong>${percentage}% match</strong></p>
        <progress value="${percentage}" max="100" style="width:100%;height:18px;"></progress>
        <p>This is a rule-based estimate based on your selected answers, not a guarantee of career success.</p>

        <h3>📚 Skills to Learn</h3>
        <p>${best.learn.join(", ")}</p>

        <h3>🧩 Skills to Develop Next</h3>
        <p>Your selected strongest skill: ${skill.replace(/-/g, " ")}.</p>
        <p>Start learning the topics listed above and practise them through small projects.</p>

        <h3>💼 Possible Job Roles</h3>
        <p>${best.jobs.join(", ")}</p>

        <h3>🔄 Alternative Career</h3>
        <p>${alternative.name}</p>

        <h3>🗺️ 8-Week Career Roadmap</h3>
        <ul>
            ${best.roadmap.map(item => `<li>${item}</li>`).join("")}
        </ul>
    `;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}
    </script>

</body>

</html>
